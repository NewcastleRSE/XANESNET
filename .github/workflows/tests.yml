# Run the test suite on every push and pull request.
#
# Installs the CPU PyTorch / PyG stack first (matching README guidance), then
# the package with the ``dev`` and ``lightning`` extras, and finally
# ``./run_tests.sh``. Use ``./run_tests.sh -q`` below if full dry-runs are too
# slow for CI.

name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TORCH: "2.6.0"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install NumPy, SciPy and PyTorch (CPU)
        run: |
          python -m pip install "numpy>=1.26,<3" "scipy>=1.12"
          python -m pip install "torch==${TORCH}" --index-url https://download.pytorch.org/whl/cpu

      - name: Install PyTorch Geometric extensions
        run: |
          python -m pip install torch-scatter torch-sparse torch-cluster \
            -f "https://data.pyg.org/whl/torch-${TORCH}+cpu.html"

      - name: Install XANESNET with test extras
        run: python -m pip install -e ".[dev,lightning]"

      - name: Show environment
        run: |
          python -V
          python -c "import torch; print('torch', torch.__version__)"
          python -c "import torch_geometric; print('torch_geometric', torch_geometric.__version__)"
          python -c "import lightning; print('lightning', lightning.__version__)"

      - name: Run tests
        run: ./run_tests.sh
