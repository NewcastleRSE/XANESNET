# Mirror the GitHub repository to GitLab after pushes to main.
#
# Requires a repository secret named GITLAB_SSH_PRIVATE_KEY whose value is the
# private half of an SSH key that can push to git@gitlab.com:team-xnet/xanesnet.git.

name: Mirror to GitLab

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: mirror-gitlab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  to_gitlab:
    name: Push to GitLab
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror to GitLab over SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.GITLAB_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t rsa,ecdsa,ed25519 gitlab.com >> ~/.ssh/known_hosts
          git remote add gitlab git@gitlab.com:team-xnet/xanesnet.git
          git push gitlab HEAD:main --force
