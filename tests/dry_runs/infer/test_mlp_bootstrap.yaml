# Bootstrap ensemble dry-run inference configuration.

seed: 2025
device: cpu

datasource:
  datasource_type: pmgjson
  json_path: ./data/toy_data/
  spectrum_key: "XANES"

dataset:
  root: ./data/processed/toy_data_mlp_bootstrap_test/
  preload: True
  skip_prepare: False

strategy:
  strategy_type: bootstrap
  n_models: 2
  sample_fraction: 1.0

inferencer:
  inferencer_type: ensemble
  batch_size: 4
  shuffle: False
  drop_last: False
  num_workers: 0
  buffer_size: 1000
  model_device_policy: sequential
