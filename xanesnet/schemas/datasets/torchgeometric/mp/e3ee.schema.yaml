$schema: https://json-schema.org/draft/2020-12/schema
$id: e3ee.schema.yaml
title: 'XANESNET dataset schema: e3ee_mp'
$defs:
  datasetE3EEMP:
    type: object
    additionalProperties: false
    required:
    - dataset_type
    - root
    - graph_builder
    - att_graph_builder
    properties:
      graph_builder:
        $ref: ../../graph_types.schema.yaml#/$defs/graphBuilder
        description: Main graph builder configuration.
      att_graph_builder:
        $ref: ../../graph_types.schema.yaml#/$defs/graphBuilder
        description: Attention graph builder configuration.
      use_path_branch:
        type: boolean
        default: false
        description: Whether to precompute target-site-centered paths.
      max_paths_per_structure:
        type: integer
        minimum: 1
        default: 128
        description: Maximum target-site paths saved per structure.
      num_workers:
        type:
        - integer
        - 'null'
        default: null
        $comment: null or non-positive means use os.cpu_count() in the multiprocessing mixin.
        description: Requested worker process count.
      root:
        type: string
        description: Directory that stores processed ``.pth`` files.
      preload:
        type: boolean
        default: true
        description: Whether to preload processed samples.
      skip_prepare:
        type: boolean
        default: false
        description: Whether to reuse existing processed files.
      split_ratios:
        type:
        - array
        - 'null'
        items:
          type: number
          minimum: 0
        minItems: 1
        default:
        - 1.0
        $comment: Runtime requires the values to sum to 1.0 when split_indexfile is null.
        description: Optional split ratios.
      split_indexfile:
        type:
        - string
        - 'null'
        default: null
        description: Optional path to split indices.
      dataset_type:
        const: e3ee_mp
        description: Registered dataset type name.
    description: Multiprocessing variant of :class:`E3EEDataset`. See the parent for semantics.
description: Dataset schemas backed by ``DatasetRegistry`` classes and dataset constructor signatures.
