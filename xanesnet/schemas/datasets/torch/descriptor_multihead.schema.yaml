$schema: https://json-schema.org/draft/2020-12/schema
$id: descriptor_multihead.schema.yaml
title: 'XANESNET dataset schema: descriptor multihead'
$defs:
  datasetDescriptorMultihead:
    type: object
    additionalProperties: false
    required:
    - dataset_type
    - root
    properties:
      descriptors:
        type: array
        minItems: 1
        items:
          $ref: ../../descriptors/descriptors.schema.yaml#/$defs/descriptor
        default:
        - descriptor_type: wacsf
          r_min: 1.0
          r_max: 6.0
          n_g2: 16
          n_g4: 32
        description: Descriptor configuration objects.
      root:
        type: string
        description: Directory that stores processed ``.pth`` files.
      preload:
        type: boolean
        default: true
        description: Whether to preload processed samples.
      skip_prepare:
        type: boolean
        default: false
        description: Whether to reuse existing processed files.
      split_ratios:
        type:
        - array
        - 'null'
        items:
          type: number
          minimum: 0
        minItems: 1
        default:
        - 1.0
        $comment: Runtime requires the values to sum to 1.0 when split_indexfile is null.
        description: Optional split ratios.
      split_indexfile:
        type:
        - string
        - 'null'
        default: null
        description: Optional path to split indices.
      dataset_type:
        const: descriptor_multihead
        description: Registered descriptor multi-head dataset type name.
    description: Descriptor-based dataset for multi-head models (descriptors -> spectra).
  datasetDescriptorMultiheadInverse:
    type: object
    additionalProperties: false
    required:
    - dataset_type
    - root
    properties:
      descriptors:
        type: array
        minItems: 1
        items:
          $ref: ../../descriptors/descriptors.schema.yaml#/$defs/descriptor
        default:
        - descriptor_type: wacsf
          r_min: 1.0
          r_max: 6.0
          n_g2: 16
          n_g4: 32
        description: Descriptor configuration objects.
      root:
        type: string
        description: Directory that stores processed ``.pth`` files.
      preload:
        type: boolean
        default: true
        description: Whether to preload processed samples.
      skip_prepare:
        type: boolean
        default: false
        description: Whether to reuse existing processed files.
      split_ratios:
        type:
        - array
        - 'null'
        items:
          type: number
          minimum: 0
        minItems: 1
        default:
        - 1.0
        $comment: Runtime requires the values to sum to 1.0 when split_indexfile is null.
        description: Optional split ratios.
      split_indexfile:
        type:
        - string
        - 'null'
        default: null
        description: Optional path to split indices.
      dataset_type:
        const: descriptor_multihead_inverse
        description: Registered descriptor multi-head dataset type name for inverse prediction.
    description: Descriptor-based dataset for inverse multi-head models (spectra -> descriptors).
description: Dataset schemas backed by ``DatasetRegistry`` classes and dataset constructor signatures.
