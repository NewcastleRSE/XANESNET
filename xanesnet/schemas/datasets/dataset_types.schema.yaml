$schema: https://json-schema.org/draft/2020-12/schema
$id: dataset_types.schema.yaml
title: XANESNET dataset value types
$defs:
  datasetType:
    type: string
    enum:
    - descriptor
    - descriptor_inverse
    - descriptor_mp
    - descriptor_inverse_mp
    - envembed
    - envembed_mp
    - geometrygraph
    - geometrygraph_mp
    - gemnet
    - gemnet_mp
    - gemnet_oc
    - gemnet_oc_mp
    - e3ee
    - e3ee_mp
    - e3ee_full
    - e3ee_full_mp
    - descriptor_multihead
    - descriptor_multihead_inverse
    - descriptor_multihead_mp
    - descriptor_multihead_inverse_mp
    description: Dataset registry key accepted by ``DatasetRegistry.get``.
description: Dataset schemas backed by ``DatasetRegistry`` classes and dataset constructor signatures.
