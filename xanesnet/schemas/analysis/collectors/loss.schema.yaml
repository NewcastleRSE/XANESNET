$schema: https://json-schema.org/draft/2020-12/schema
$id: loss.schema.yaml
title: XANESNET loss collector schema
$defs:
  collectorLoss:
    type: object
    additionalProperties: false
    required:
    - collector_type
    - loss
    properties:
      collector_type:
        const: loss
        description: Registered collector name from the analysis configuration.
      loss:
        $ref: ../../losses/losses.schema.yaml#/$defs/loss
        description: Loss configuration used to score each sample.
      energy_resolved:
        type: boolean
        default: false
        description: If ``True``, collect the per-channel loss vector under ``<loss_type>_energy`` instead of the scalar value.
    description: Compute a configured loss between prediction and target spectra, optionally per energy channel.
description: Analysis component schemas used by ``core_analyze`` setup functions and analysis registries.
