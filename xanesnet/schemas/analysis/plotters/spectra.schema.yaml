$schema: https://json-schema.org/draft/2020-12/schema
$id: spectra.schema.yaml
title: 'XANESNET plotter schema: spectra_all'
$defs:
  plotterSpectra:
    type: object
    additionalProperties: false
    required:
    - plotter_type
    properties:
      plotter_type:
        const: spectra_all
        description: Registered plotter name from the analysis configuration.
      plot_size:
        $ref: plotters.schema.yaml#/$defs/plotSize
      latex_font:
        $ref: plotters.schema.yaml#/$defs/latexFont
      legend_position:
        $ref: plotters.schema.yaml#/$defs/legendPosition
      max_pages:
        type:
        - integer
        - 'null'
        minimum: 1
        default: null
        description: Maximum number of pages per PDF. ``None`` writes all selected
          samples; otherwise a random subset is drawn using the global seed.
    description: Plot predicted and target spectra for a random subset of every
      selected sample. With two or more prediction readers, also plot combined
      pages overlaying every reader's prediction on the samples they share.
description: Analysis component schemas used by ``core_analyze`` setup functions and analysis registries.
