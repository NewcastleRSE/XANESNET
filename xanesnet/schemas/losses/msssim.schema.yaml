$schema: https://json-schema.org/draft/2020-12/schema
$id: msssim.schema.yaml
title: 'XANESNET loss schema: msssim'
$defs:
  lossMSSSIM:
    type: object
    additionalProperties: false
    required:
    - loss_type
    properties:
      loss_type:
        const: msssim
        description: Identifier string for this loss type.
      loss_weight:
        type: number
        exclusiveMinimum: 0
        description: Weight for this loss term in the combined loss list. If omitted, defaults
          to equal weighting across all terms.
      fractions:
        type: array
        items:
          type: number
        default:
        - 0.01
        - 0.05
        - 0.1
        - 0.15
        - 0.2
        - 0.25
        description: Kernel size fractions of ``N`` for each SSIM scale. Defaults to ``[0.01, 0.05, 0.10, 0.15, 0.2, 0.25]``.
      data_range:
        oneOf:
        - type: number
          exclusiveMinimum: 0
        - type: 'null'
        default: null
        description: Dynamic range of the signal (``max - min``). When ``null``, auto-detected from the first batch's target range and held fixed thereafter. Defaults to ``null``.
      K:
        type: array
        minItems: 2
        maxItems: 2
        items:
          type: number
        default:
        - 0.01
        - 0.03
        description: Stability constants ``(K1, K2)`` for luminance and contrast-structure terms. Defaults to ``(0.01, 0.03)``.
      use_weighted_sum:
        type: boolean
        default: false
        description: If ``True``, combine scales via weighted sum instead of the default multiplicative combination. Defaults
          to ``False``.
      weights:
        oneOf:
        - type: array
          items:
            type: number
        - type: 'null'
        default: null
        description: Per-scale weights when ``use_weighted_sum=True``. If ``None``, uniform weights are used. Defaults to
          ``None``.
    description: Multi-kernel SSIM loss for 1-D signals.
description: Loss schemas backed by ``LossRegistry`` classes and loss constructor signatures.
