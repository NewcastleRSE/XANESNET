$schema: https://json-schema.org/draft/2020-12/schema
$id: mh_cnn.schema.yaml
title: 'XANESNET model schema: mh_cnn'
$defs:
  modelMHCNN:
    type: object
    additionalProperties: false
    required:
    - model_type
    - in_size
    - out_size
    properties:
      dropout:
        type: number
        minimum: 0
        maximum: 1
        default: 0.1
        description: Dropout probability applied after each convolutional layer. Range ``[0, 1)``.
      num_conv_layers:
        type: integer
        minimum: 1
        default: 3
        description: Number of convolutional layers in the shared encoder.
      activation:
        $ref: ../components/component_types.schema.yaml#/$defs/activationName
        default: prelu
        description: Name of the activation function for convolutional and head layers.
      out_channel:
        type: integer
        minimum: 1
        default: 32
        description: Number of output channels for the first convolutional layer.
      channel_mul:
        type: integer
        minimum: 1
        default: 2
        description: Multiplicative factor applied to the channel count at each subsequent conv layer.
      kernel_size:
        type: integer
        minimum: 1
        default: 3
        description: Size of the convolutional kernel.
      stride:
        type: integer
        minimum: 1
        default: 2
        description: Stride for each convolutional layer.
      head_hidden_size:
        type: integer
        minimum: 1
        default: 512
        description: Width of the first hidden layer in each prediction head.
      head_num_hidden_layers:
        type: integer
        minimum: 0
        default: 2
        description: Number of hidden layers in each prediction head (excluding the output layer).
      head_shrink_rate:
        type: number
        exclusiveMinimum: 0
        default: 1.0
        description: Multiplicative factor applied to each head's layer width at each depth step.
      model_type:
        const: mh_cnn
        description: Model type identifier string.
      in_size:
        $ref: ../shared/value_types.schema.yaml#/$defs/autoPositiveInteger
        description: Number of input features.
      out_size:
        $ref: ../shared/value_types.schema.yaml#/$defs/autoPositiveIntegerArray
        description: Output size for each prediction head; all entries must be equal because predictions are stacked.
    description: Multi-head CNN with one prediction head per datasource subdirectory.
  modelTrainMHCNN:
    $ref: '#/$defs/modelMHCNN'
    description: Training view of modelMHCNN; automatic dimension fields may use the case-insensitive auto token.
  modelInferMHCNN:
    $ref: '#/$defs/modelMHCNN'
    description: Inference view of modelMHCNN; runtime validation rejects unresolved auto values after checkpoint merge.
description: Model schemas backed by ``ModelRegistry`` classes and model constructor signatures.
