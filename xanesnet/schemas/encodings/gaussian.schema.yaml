$schema: https://json-schema.org/draft/2020-12/schema
$id: gaussian.schema.yaml
title: 'XANESNET encoding schema: gaussian'
$defs:
  encodingGaussian:
    type: object
    additionalProperties: false
    required:
    - encoding_type
    - widths
    - basis_stride
    - num_points
    - nonneg_output
    properties:
      encoding_type:
        const: gaussian
        description: Identifier string for this encoding type.
      widths:
        type: array
        minItems: 1
        items:
          type: number
          exclusiveMinimum: 0
        description: Gaussian standard deviations in spectral grid points (bins), one basis family
          per entry.
      basis_stride:
        $ref: ../shared/value_types.schema.yaml#/$defs/positiveInteger
        description: Spacing between Gaussian centers in grid points.
      num_points:
        $ref: ../shared/value_types.schema.yaml#/$defs/autoPositiveInteger
        description: Number of points in the spectra to encode; may be the training-time ``auto``
          token, which is resolved from the prepared dataset.
      nonneg_output:
        type: boolean
        description: Whether decoded spectra are clamped to non-negative values.
    description: Gaussian-basis encoding that represents spectra as basis-expansion coefficients.
description: Encoding schemas backed by ``SpectraEncodingRegistry`` classes and encoding constructor signatures.
