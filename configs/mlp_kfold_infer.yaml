# Example configuration for MLP k-fold ensemble inference with toy data.

seed: 2025
device: cuda

datasource:
  datasource_type: pmgjson
  json_path: ./data/toy_data/
  spectrum_key: "XANES"

dataset:
  root: ./data/processed/toy_data_mlp_kfold/  # Where should the processed data be stored
  preload: True
  skip_prepare: False

inferencer:
  inferencer_type: ensemble
  batch_size: 4
  shuffle: False
  drop_last: False
  num_workers: 0
  buffer_size: 1000
  model_device_policy: sequential
