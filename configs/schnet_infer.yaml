# Example configuration for SchNet inference with toy data.

seed: 2025
device: cuda

datasource:
  datasource_type: pmgjson
  json_path: ./data/toy_data/
  spectrum_key: "XANES"

dataset:
  root: ./data/processed/toy_data_schnet/  # Where should the processed data be stored
  preload: True                    # Preload dataset into RAM if True; otherwise load on-the-fly
  skip_prepare: False

strategy:
  strategy_type: single

inferencer:
  inferencer_type: basic
  batch_size: 4
  shuffle: False
  drop_last: False
  num_workers: 0
  buffer_size: 1000